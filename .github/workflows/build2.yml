on: push
jobs:
  b:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          S=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | "$S" --licenses >/dev/null || true
          "$S" --channel=0 "platforms;android-37.0" "build-tools;37.0.0" || true
      - run: |
          sed -i /aapt2FromMaven/d gradle.properties
          chmod +x gradlew
          ./gradlew :app:assembleStableRelease --no-daemon > build.log 2>&1 || (tail -c 3000 build.log; exit 1)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: b-${{ github.run_number }}
          files: app/build/outputs/apk/Stable/release/*.apk
      - uses: softprops/action-gh-release@v2
        if: failure()
        with:
          tag_name: f-${{ github.run_number }}
          files: build.log
