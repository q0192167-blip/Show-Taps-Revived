name: Build Show Taps APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStableRelease --no-daemon --stacktrace

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ShowTaps build ${{ github.run_number }}
          files: app/build/outputs/apk/Stable/release/*.apk
