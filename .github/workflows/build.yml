name: Build Show Taps APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK packages
        run: |
          set -x
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          "$SM" --version || true
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --channel=0 "platforms;android-37.0" || true
          "$SM" --channel=0 "build-tools;37.0.0" || true
          ls "$SDK/platforms" || true

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStableRelease --no-daemon --stacktrace

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ShowTaps build ${{ github.run_number }}
          files: app/build/outputs/apk/Stable/release/*.apk
